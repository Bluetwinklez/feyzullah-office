name: Application tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run application tests
        run: npm test

      - name: Verify Electron installation
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: node node_modules/electron/install.js
      - name: Smoke test the real desktop window
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        timeout-minutes: 2
        env:
          OFIS_DEMO: '1'
          OFIS_SMOKE: '1'
          OFIS_SIZE: '1280x800'
          OFIS_SNAPSHOT: ${{ runner.temp }}/office-smoke.png
          FEYZULLAH_HOME: ${{ runner.temp }}/office-smoke-data
        run: |
          mkdir -p "$FEYZULLAH_HOME"
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox .
          test -s "$OFIS_SNAPSHOT"
      - name: Upload desktop smoke evidence
        if: always() && matrix.node == 24 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke
          path: ${{ runner.temp }}/office-smoke.png
          if-no-files-found: ignore
