name: Application tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run application tests
        run: npm test

      - name: Verify Electron installation
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: node node_modules/electron/install.js
      - name: Smoke test the real desktop window
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        timeout-minutes: 2
        env:
          OFIS_DEMO: '1'
          OFIS_SMOKE: '1'
          OFIS_SIZE: '1280x800'
          OFIS_SNAPSHOT: ${{ runner.temp }}/office-smoke.png
          FEYZULLAH_HOME: ${{ runner.temp }}/office-smoke-data
        run: |
          mkdir -p "$FEYZULLAH_HOME"
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox .
          test -s "$OFIS_SNAPSHOT"
      - name: Upload desktop smoke evidence
        if: always() && matrix.node == 24 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke
          path: ${{ runner.temp }}/office-smoke.png
          if-no-files-found: ignore
